name: Tests

on:
  push:
    branches: [master, develop, feature/*]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requests-mock is a TEST-only dependency: it fakes the HTTP
          # transport so the connection layer can be exercised without a
          # VIMAR web server. It does not pull in Home Assistant, so the
          # "unit tests run standalone" contract still holds.
          pip install pytest pytest-cov requests requests-mock

      - name: Run unit tests (no HA required)
        run: |
          pytest tests/unit/ -v --cov=custom_components/vimar/vimarlink --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.13'
        with:
          files: ./coverage.xml
          flags: unittests

  # The integration suite drives the entities and the coordinator with mocks
  # and therefore needs Home Assistant itself. It used to run only on
  # developer machines, so regressions in cover tracking, climate writes,
  # entity availability, the SAI2 decoding or the platform lifecycle could
  # reach master unnoticed.
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pins homeassistant + the matching pytest-homeassistant-custom-component,
          # so CI runs the same stack as the development environment.
          pip install -r requirements_dev.txt

      - name: Run integration tests (Home Assistant required)
        run: |
          pytest tests/integration/ -v --cov=custom_components/vimar --cov-report=term
