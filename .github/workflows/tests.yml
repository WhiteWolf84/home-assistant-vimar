name: Tests

on:
  push:
    # Every branch, not just master/develop/feature/*. Working branches named
    # fix/*, perf/*, style/* matched none of those, so they were pushed - and
    # one was even tagged for a HACS pre-release - without tests ever running.
    # That is how a broken CI dependency reached master unnoticed.
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requests-mock is a TEST-only dependency: it fakes the HTTP
          # transport so the connection layer can be exercised without a
          # VIMAR web server. It does not pull in Home Assistant, so the
          # "unit tests run standalone" contract still holds.
          pip install pytest pytest-cov requests requests-mock

      - name: Run unit tests (no HA required)
        run: |
          pytest tests/unit/ -v --cov=custom_components/vimar/vimarlink --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.13'
        with:
          files: ./coverage.xml
          flags: unittests

  # The integration suite drives the entities and the coordinator with mocks
  # and therefore needs Home Assistant itself. It used to run only on
  # developer machines, so regressions in cover tracking, climate writes,
  # entity availability, the SAI2 decoding or the platform lifecycle could
  # reach master unnoticed.
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Home Assistant 2026.3.0+ declares Requires-Python >=3.14.2, so this
        # job CANNOT run on 3.13 - pip finds no installable homeassistant.
        # The unit job above stays on 3.13 on purpose: it proves the vimarlink
        # library and examples/example.py still work without Home Assistant,
        # on the older interpreter.
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pins homeassistant + the matching pytest-homeassistant-custom-component,
          # so CI runs the same stack as the development environment.
          pip install -r requirements_dev.txt

      - name: Run integration tests (Home Assistant required)
        run: |
          pytest tests/integration/ -v --cov=custom_components/vimar --cov-report=term

  # The same suite against the newest Home Assistant release, ahead of
  # requirements_dev.txt. pytest-homeassistant-custom-component has no release
  # for Home Assistant 2026.11 yet (0.13.375 pins 2026.10.4), so this job
  # installs Home Assistant without it and SKIPS the six files that need its
  # `hass` fixture: they do NOT run on 2026.11 until the plugin catches up.
  # Then pin both in requirements_dev.txt and drop this job.
  integration-tests-ha-2026-11:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant==2026.11.0 pytest==9.0.3 pytest-asyncio==1.4.0 requests-mock==1.12.1

      - name: Run integration tests (without the plugin-dependent files)
        run: |
          pytest tests/integration/ -v \
            --ignore=tests/integration/test_device_identifiers.py \
            --ignore=tests/integration/test_device_override_migration.py \
            --ignore=tests/integration/test_platform_lifecycle.py \
            --ignore=tests/integration/test_room_labels.py \
            --ignore=tests/integration/test_sai2_stable_ids.py \
            --ignore=tests/integration/test_update_serialisation.py
