name: Lint

on:
  push:
    # Every branch - see the note in tests.yml: fix/*, perf/* and style/*
    # branches were never linted before reaching master.
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  # ruff is the single formatter AND linter. black used to run alongside it on
  # custom_components/, where the two agree; they disagree on how to lay out an
  # `assert` with a message, which is why running either over tests/ produced
  # churn - and why tests/ ended up covered by neither.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: chartboost/ruff-action@v1
        with:
          src: "./custom_components/vimar ./tests"
      - uses: chartboost/ruff-action@v1
        with:
          args: "format --check"
          src: "./custom_components/vimar ./tests"

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Python 3.14 and the pinned Home Assistant, matching requirements_dev
      # and the integration-test job. This job used to install homeassistant
      # 2026.1.3 on Python 3.13, so the type checker validated the integration
      # against an API six months older than the one it supports - and against
      # a version the manifest does not even claim to run on (2026.5.0+).
      # Rules like reportIncompatibleMethodOverride read @final off the
      # installed Home Assistant, so checking against the wrong one silently
      # checks the wrong thing.
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyright homeassistant==2026.7.0
      - name: Run pyright
        run: pyright custom_components/vimar
